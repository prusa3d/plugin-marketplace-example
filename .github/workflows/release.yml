name: Publish to Plugin Marketplace
on:
  release:
    types: [published]
permissions:
  contents: read
  id-token: write # the run proves which repository and workflow it is with an OIDC token
jobs:
  publish:
    runs-on: ubuntu-latest
    # The signing key lives in this environment: only v* tags, and a maintainer approves each run.
    environment: release
    steps:
      - uses: actions/checkout@v7
      - uses: prusa3d/plugin-marketplace-publish@v1
        with:
          path: hello
          private-key: ${{ secrets.PRUSA_SLICER_PLUGIN_MARKETPLACE_SIGNING_KEY }}
